# Copyright (c) 2026 BeardedSheeep

[project]
name = "realtimedatastreaming"
version = "0.1.0"
description = "Realtime data streaming project scaffold."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "BeardedSheep2408" },
]
keywords = [
    "ci-cd",
    "docker",
    "python",
    "data-engineering",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "authlib>=1.3.0,<2.0.0",
    "cachetools>=7.1.4,<8.0.0",
    "cassandra-driver>=3.29.0,<4.0.0",
    "confluent-kafka>=2.14.2,<3.0.0",
    "email-validator>=2.0.0,<3.0.0",
    "httpx>=0.28.0,<1.0.0",
    "jsonschema>=4.26.0",
    "orjson>=3.11.9",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyspark>=4.1.2,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/BeardedSheeep/realtimedatastreaming"
Repository = "https://github.com/BeardedSheeep/realtimedatastreaming"
Issues = "https://github.com/BeardedSheeep/realtimedatastreaming/issues"

[project.scripts]
realtimedatastreaming = "realtimedatastreaming.cli:main"

[dependency-groups]
dev = [
    "nox[uv]>=2026.4.10",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
]
format = [
    "ruff>=0.15.16",
]
lint = [
    "ruff>=0.15.16",
]
typing = [
    "mypy>=1.13.0",
    "typing-extensions>=4.12.0",
]
test = [
    "coverage[toml]>=7.14.1",
    "nox[uv]>=2026.4.10",
    "PyYAML>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.12.0",
]

[build-system]
requires = ["hatchling>=1.30.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["realtimedatastreaming"]

[tool.hatch.build.targets.sdist]
include = [
    "realtimedatastreaming",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 120
preview = true
target-version = "py312"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".nox",
    ".pytest_cache",
    ".venv",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
check_untyped_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = [
    "-m",
    "not integration",
]
markers = [
    "integration: tests that require external services such as Kafka or Schema Registry",
]

[tool.coverage.run]
branch = true
source = ["realtimedatastreaming"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
