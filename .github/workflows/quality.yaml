      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}" || {
            curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/install-uv.sh
            sh /tmp/install-uv.sh
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.local/bin:${PATH}"
          }
          uv --version

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Run format session
        run: uv run nox -s format

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    needs: audit
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}" || {
            curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/install-uv.sh
            sh /tmp/install-uv.sh
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.local/bin:${PATH}"
          }
          uv --version

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Run lint session
        run: uv run nox -s lint

  typing:
    name: Typing
    runs-on: ubuntu-24.04
    needs: audit
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}" || {
            curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/install-uv.sh
            sh /tmp/install-uv.sh
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.local/bin:${PATH}"
          }
          uv --version

      - name: Install dependencies
        run: uv sync --all-groups --locked

      - name: Run typing session
        run: uv run nox -s typing

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: audit
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: |
          python -m pip install --disable-pip-version-check "uv==${UV_VERSION}" || {
            curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" -o /tmp/install-uv.sh
            sh /tmp/install-uv.sh
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
            export PATH="${HOME}/.local/bin:${PATH}"
