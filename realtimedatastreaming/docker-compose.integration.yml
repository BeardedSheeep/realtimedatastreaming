x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: realtimedatastreaming/orchestration/Dockerfile.airflow
  environment: &airflow-common-env
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/project/realtimedatastreaming/orchestration
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__STORE_SERIALIZED_DAGS: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER:-airflow}:${AIRFLOW_POSTGRES_PASSWORD:-local-dev-only-airflow-postgres-password}@postgres/${AIRFLOW_POSTGRES_DB:-airflow}
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY:-local-dev-only-airflow-webserver-secret-key}
    APP_ENV: development
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    KAFKA_USERS_CREATED_TOPIC: users_created
    KAFKA_USERS_CREATED_INVALID_TOPIC: users_created_invalid
    LOG_FORMAT: json
    PYTHONPATH: /opt/airflow/project
    SCHEMA_REGISTRY_URL: http://schema-registry:8081
  volumes:
    - ..:/opt/airflow/project
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
    schema-registry:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.6-bookworm
    profiles: ["airflow"]
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD:-local-dev-only-airflow-postgres-password}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB:-airflow}
    volumes:
      - airflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 24

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    ports:
      - "19092:19092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:19092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 5s
      timeout: 10s
      retries: 24

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "18081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://schema-registry:8081/subjects"]
      interval: 5s
      timeout: 10s
      retries: 24

  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USERNAME:-airflow}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-local-dev-only-airflow-admin-password}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME:-Local}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME:-Admin}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL:-airflow@example.com}" || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://airflow-webserver:8080/health"]
      interval: 10s
      timeout: 10s
      retries: 12

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    command: scheduler

  spark-user-profiles:
    build:
      context: ..
      dockerfile: realtimedatastreaming/streaming/Dockerfile.spark
      target: runtime
    profiles: ["spark"]
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_USERS_CREATED_TOPIC: users_created
      KAFKA_USERS_CREATED_INVALID_TOPIC: users_created_invalid
      LOG_FORMAT: json
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SPARK_APP_NAME: realtimedatastreaming-user-profiles
      SPARK_CHECKPOINT_LOCATION: /tmp/realtimedatastreaming/checkpoints
      SPARK_MASTER_URL: local[*]
    volumes:
      - spark_checkpoints:/tmp/realtimedatastreaming/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

  spark-user-profiles-test:
    build:
      context: ..
      dockerfile: realtimedatastreaming/streaming/Dockerfile.spark
      target: test
    profiles: ["spark-test"]
    environment:
      APP_ENV: development
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_USERS_CREATED_TOPIC: users_created
      KAFKA_USERS_CREATED_INVALID_TOPIC: users_created_invalid
      LOG_FORMAT: json
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      SPARK_APP_NAME: realtimedatastreaming-user-profiles-test
      SPARK_CHECKPOINT_LOCATION: /tmp/realtimedatastreaming/checkpoints
      SPARK_MASTER_URL: local[*]
    volumes:
      - spark_checkpoints:/tmp/realtimedatastreaming/checkpoints
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy

volumes:
  airflow_logs:
  airflow_postgres:
  spark_checkpoints:
